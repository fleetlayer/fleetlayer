[package]
name = "fleetlayer-cli"
description = "fleetlayer: the command line for sessions, messages, hooks and enrolment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fleetlayer"
path = "src/main.rs"

[dependencies]
nix = { version = "0.32.0", default-features = false, features = ["user"] }
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
async-trait = "0.1.92"
crossterm = "0.29.0"
base64 = "0.23.1"
yaml_serde = "0.10.7"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"

[lints]
workspace = true
