[package]
name = "fleetlayer-node"
description = "fleetlayer-node: the daemon on each machine (or Unix user) that runs plugins and links them to the control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fleetlayer-node"
path = "src/main.rs"

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
fleetlayer-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
async-trait = "0.1.92"
yaml_serde = "0.10.7"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11"
hex = "0.4"
age = { version = "0.12.1", default-features = false, features = ["armor"] }
nix = { version = "0.32.0", default-features = false, features = ["hostname", "user", "socket"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"

[lints]
workspace = true
