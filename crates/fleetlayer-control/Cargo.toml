[package]
name = "fleetlayer-control"
description = "fleetlayer-control: the control plane (machines, sessions, messages, channels, webhooks), self-hosted or hosted. It never holds credentials."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
subtle = "2.6"
futures = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
