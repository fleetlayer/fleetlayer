# On a version tag (v0.2.0), build every binary for Linux and macOS, attest where each came from, and publish them
# with SHA-256 checksums as a GitHub release. Nodes update themselves from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p fleetlayer-cli -p fleetlayer-node -p fleetlayer-control
          -p fleetlayer-herdr -p fleetlayer-claude-code -p fleetlayer-summaries
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=fleetlayer-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          for b in fleetlayer fleetlayer-node fleetlayer-control fleetlayer-herdr fleetlayer-claude-code fleetlayer-summaries; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$name/"
          done
          cp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
