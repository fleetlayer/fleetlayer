# On a version tag (v0.2.0), build every binary for Linux and macOS, sign and notarise the macOS ones, attest where
# each came from, and publish them with SHA-256 checksums as a GitHub release. Nodes update themselves from these
# releases. Signing: scripts/release/sign-macos.sh and docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    # Notarising usually takes a few minutes, but Apple's queue can take much longer
    timeout-minutes: 90
    env:
      BINARIES: >-
        fleetlayer fleetlayer-node fleetlayer-control fleetlayer-herdr fleetlayer-rex fleetlayer-claude-code fleetlayer-summaries
        fleetlayer-file-sync fleetlayer-claude-auth-manager fleetlayer-claude-accounts fleetlayer-pages fleetlayer-gateway
        fleetlayer-signin fleetlayer-shared-folders fleetlayer-scheduler fleetlayer-cookies fleetlayer-egress fleetlayer-herdr-fleet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p fleetlayer-cli -p fleetlayer-node -p fleetlayer-control
          -p fleetlayer-herdr -p fleetlayer-rex -p fleetlayer-claude-code -p fleetlayer-summaries -p fleetlayer-file-sync -p fleetlayer-claude-auth-manager -p fleetlayer-accounts -p fleetlayer-pages -p fleetlayer-gateway -p fleetlayer-signin -p fleetlayer-shared-folders -p fleetlayer-scheduler -p fleetlayer-cookies -p fleetlayer-egress -p fleetlayer-herdr-fleet
      # Skipped with a warning where the secrets aren't set (a fork), so the build still passes there
      - name: Sign and notarise the macOS binaries
        if: runner.os == 'macOS'
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/release/sign-macos.sh "target/${{ matrix.target }}/release" $BINARIES
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=fleetlayer-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          for b in $BINARIES; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$name/"
          done
          cp LICENSE NOTICE README.md "dist/$name/"
          scripts/collect-skills "dist/$name/skills"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a "-" (v0.3.8-rc.1) is a prerelease, for testing: /releases/latest skips it, so install.sh and the
        # nodes' auto-update never pick it up (FLEETLAYER_VERSION=v0.3.8-rc.1 install.sh installs it on purpose). The
        # node reads v0.3.8-rc.1 as 0.3.8, so a node on an rc doesn't update itself to the final v0.3.8: rcs are for
        # throwaway test installs.
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
