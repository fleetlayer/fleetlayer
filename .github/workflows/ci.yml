name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  # claude-auth-manager writes setup tokens into the macOS login keychain through /usr/bin/security. This runs its
  # tests on macOS, and the real-keychain test against a throwaway keychain made the default (never a real login
  # keychain).
  macos-keychain:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Make a throwaway keychain the default
        run: |
          security create-keychain -p ci ci.keychain-db
          security set-keychain-settings ci.keychain-db
          security unlock-keychain -p ci ci.keychain-db
          security list-keychains -d user -s ci.keychain-db
          security default-keychain -d user -s ci.keychain-db
      - run: cargo test --locked -p fleetlayer-claude-auth-manager
      - run: cargo test --locked -p fleetlayer-claude-auth-manager -- --ignored real_keychain
