# fleetlayer.ai: build the site from docs/ and site/, check its links, and deploy it to Cloudflare on pushes to main.
# Separate from CI and releases on purpose: a docs problem never blocks main's checks or a release.
# Deploying needs the repo secret CLOUDFLARE_API_TOKEN (Workers deploys on one account) and the repo variable
# CLOUDFLARE_ACCOUNT_ID; without them the build and link check still run and the deploy is skipped with a warning.
name: Site

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "README.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", "site/**", "README.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set: built and checked, not deployed."
            exit 0
          fi
          npx --yes wrangler@4.168.0 deploy
