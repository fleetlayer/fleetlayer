[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# Its own workspace and lockfile: matrix-sdk's SQLite store links an older libsqlite3-sys than sqlx and rusqlite here.
exclude = ["plugins/matrix"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/fleetlayer/fleetlayer"
rust-version = "1.99"

[workspace.dependencies]
fleetlayer-protocol = { path = "crates/fleetlayer-protocol" }
fleetlayer-plugin = { path = "crates/fleetlayer-plugin" }
fleetlayer-secrets = { path = "crates/fleetlayer-secrets" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
jiff = { version = "1.0.2", features = ["serde"] }
thiserror = "2.0.21"
anyhow = "1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.9", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

# Builds run on shared build servers with a few slots each: line tables only (backtraces keep file and line) make
# debug and test builds link in a fraction of the memory and disk of full debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
