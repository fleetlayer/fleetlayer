[package]
name = "fleetlayer-cookies"
description = "fleetlayer-cookies: share a site's cookies from the signed-in browser on one machine with command-line tools on another, sealed in transit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
fleetlayer-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
jiff.workspace = true
async-trait = "0.1.92"
rusqlite = { version = "0.42", features = ["bundled"] }
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = "0.10.7"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.27.0"
psl = "2.1.265"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
libc = "0.2.191"

# The workspace's lints, except that unsafe code is denied rather than forbidden, so src/disclaim.rs (macOS foreign
# calls, and nothing else) can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
