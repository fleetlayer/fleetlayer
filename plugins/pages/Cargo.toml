[package]
name = "fleetlayer-pages"
description = "fleetlayer-pages: pages for people (screenshots, reports, mock-ups) written by any agent as plain folders in a synced vault, hosted with access per space"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
jiff.workspace = true
async-trait = "0.1.92"
sha2 = "0.11"
hex = "0.4"
futures = "0.3.34"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
form_urlencoded = "1.2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Signing people in through the sign-in service (shared with the hub).
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc" }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc", features = ["testing"] }

[lints]
workspace = true
