[package]
name = "fleetlayer-dashboard"
description = "fleetlayer-dashboard: Fleetlayer's web dashboard: machines, sessions, events, approvals and admin windows, readings and a graph of the fleet, read through the control plane's API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
jiff.workspace = true
async-trait = "0.1.92"
sha2 = "0.11"
hex = "0.4"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
form_urlencoded = "1.2.3"
# Signing people in through the sign-in service (shared with pages and the hub).
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc", features = ["testing"] }

[lints]
workspace = true
