<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Claude hub</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body class="login-body">
<main class="login">
  <div class="login-brand"><img src="/assets/icon.svg" alt="" width="40" height="40"><h1>Claude hub</h1></div>
  <form class="login-card" method="post" action="/login">
    <label class="label" for="login">Login key</label>
    <input class="input mono" type="password" id="login" name="login" autocomplete="current-password" autofocus required spellcheck="false"{invalid}>
    {msg}
    <button class="btn btn-primary btn-block" type="submit">Open hub</button>
  </form>
  {hint}
</main>
</body>
</html>
