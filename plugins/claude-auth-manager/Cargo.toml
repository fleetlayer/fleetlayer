[package]
name = "fleetlayer-claude-auth-manager"
description = "fleetlayer-claude-auth-manager: one person's Claude setup tokens on every machine they run agents on, sealed in transit; sign-ins and usage stay on a machine they control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleetlayer-protocol.workspace = true
fleetlayer-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
jiff.workspace = true
async-trait = "0.1.92"
sha2 = "0.11"
hex = "0.4"
unicode-normalization = "0.1.26"
futures = "0.3.34"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
form_urlencoded = "1.2.3"
portable-pty = "0.9.0"
vt100 = "0.18.1"
# "Sign in with Fleetlayer" (shared with pages).
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
fleetlayer-oidc = { path = "../../crates/fleetlayer-oidc", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
