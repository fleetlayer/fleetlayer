name: fleetlayer-rex
summary: Connects Rex, Superlogical's terminal and session manager, so the Claude Code and Codex sessions in it are in the fleet.
kind: plugin
roles: [session_manager]
ships_with_fleetlayer: true
status: beta
licence: FSL-1.1-ALv2
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/rex
install: bundled
command: fleetlayer-rex
platforms: [linux, macos]
min_fleetlayer: 0.3.9
protocol: 1
needs: [Rex (https://www.superlogical.com/rex/docs)]
grants: []
docs: plugins/rex
config: |
  plugins:
    - name: rex
      command: fleetlayer-rex
      config:
        program: rex
security: >-
  Sees every session on its user's Rex server (labels, the program and folder in each terminal) and types into a
  terminal only to deliver a message to an agent with no channel of its own, a first prompt, or for `fleetlayer
  attach` under the access policy. It never starts a Rex server.
description: |
  The session manager plugin for [Rex](https://www.superlogical.com/rex/docs). It lists the agents in Rex terminals
  with their status from program status reports (OSC 7501), streams changes from `rex events`, opens and closes
  sessions, delivers messages by pasting them in when nothing better is available, and lets `fleetlayer attach` watch
  and drive Rex terminals. It uses only Rex's public command line and API. More in [Fleetlayer and
  Rex](https://fleetlayer.ai/docs/rex/).
