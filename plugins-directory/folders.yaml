name: folders
summary: Lets agents on other machines read folders you choose on yours, such as your screenshots and downloads.
kind: shared_tool
ships_with_fleetlayer: true
status: beta
licence: Apache-2.0
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/folders
install: bundled
command: fleetlayer-folders
platforms: [linux, macos]
min_fleetlayer: 0.3.9
needs: []
config: |
  tools:
    - name: folders
      command: fleetlayer-folders
      args: ["--folder", "screenshots=~/Screenshots", "--folder", "downloads=~/Downloads"]
      allow: ["*@server"]
security: >-
  Read-only, and only files directly inside the folders you name: no subfolders, hidden files or symbolic links, and
  no tool that writes. Whoever may use the tool can read everything in those folders, so share Downloads (strangers'
  files, private documents) as its own tool when it needs stricter access than your screenshots.
docs: plugins/folders
description: |
  An MCP server the node shares with agents anywhere (`fleetlayer mcp folders@<node>`): list a folder newest first,
  the latest files, find by name or time, and read a file. Images come back as images the agent can see, downscaled
  to 1568 pixels; text as text; anything else as base64, up to 8 MB.
