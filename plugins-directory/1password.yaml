name: 1password
summary: Delivers 1Password items to the roles you grant them to, item by item, from a service-account token no agent holds.
kind: plugin
roles: [sync_source, sync_target]
ships_with_fleetlayer: true
status: beta
licence: FSL-1.1-ALv2
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/1password
install: bundled
command: fleetlayer-1password
platforms: [linux, macos]
min_fleetlayer: 0.3.13
protocol: 1
needs: [1Password's op command line on the source machine, a 1Password service account]
grants: [sync.publish, reading.publish]
config: |
  plugins:
    - name: 1password
      command: fleetlayer-1password
      grants: [sync.publish, reading.publish]
      config:
        source:                       # on the 1Password user's node
          token_files: [~/.config/fleetlayer/1password/token]
          roles:
            - { role: everyday, nodes: [agents], read: [op://github/deploy-bot/token] }
        receive: { from: secrets }    # on each role's node: the source's node
security: >-
  The service-account token stays with the source's Unix user; agents get only the items granted to their role, sealed
  to their node's key, and the control plane relays ciphertext it never stores. Values never appear in logs, readings
  or state files. Whoever can read a role's node can use its items.
docs: plugins/1password
description: |
  Grants name items (op://vault/item/field) and the nodes of a role. Each node gets one bundle, 1password/<node>,
  with exactly its items, again within minutes of a change in 1Password, and loses items (and files that need them)
  when a grant is taken away. Agents use them through fleetlayer secrets run, the replacement for op run; targets can
  also write env files and token files, mode 0600. Delivered values are redacted from everything the node sends.
