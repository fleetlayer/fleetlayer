name: dashboard
summary: Fleetlayer's web page for people - every machine, session, event and approval, live, with a graph of the fleet.
kind: plugin
roles: []
ships_with_fleetlayer: true
status: beta
licence: FSL-1.1-ALv2
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/dashboard
install: bundled
command: fleetlayer-dashboard
platforms: [linux, macos]
min_fleetlayer: 0.4.0
protocol: 1
needs: [a delegate token from the control plane, Fleetlayer's sign-in service (or a login key)]
grants: [access.check]
config: |
  plugins:
    - name: dashboard
      command: fleetlayer-dashboard
      grants: [access.check]
      config:
        listen: 127.0.0.1:0
        base_url: https://dashboard.example
        control:
          url: https://control.example
          token_file: ~/.config/fleetlayer/dashboard/control-token
        signin:
          issuer: https://signin.example
          secret_file: ~/.config/fleetlayer/signin-clients/dashboard
security: >-
  Reads only through the control plane's API with a token of its own. With a delegate token each signed-in person
  decides requests and closes windows as themselves, checked and recorded by the control plane, and opening an admin
  window takes their passkey. Every page checks the person's access again (within a minute), forms carry a
  per-session token, and it keeps no state.
docs: dashboard
description: |
  Machines with their nodes, versions, heartbeats and plugin status; sessions grouped by whether they wait on you;
  live events and who they reached; approvals and admin windows; readings; and a graph of nodes, plugins and shared
  tools. `fleetlayer-dashboard demo` serves a made-up fleet to try it. Anything it shows or does, the CLI and the API
  do too.
