name: herdr
summary: Connects herdr, the terminal session manager, so every session it runs is in the fleet.
kind: plugin
roles: [session_manager, harness]
ships_with_fleetlayer: true
status: beta
licence: FSL-1.1-ALv2
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/herdr
install: bundled
command: fleetlayer-herdr
platforms: [linux, macos]
min_fleetlayer: 0.1.0
protocol: 1
needs: [herdr (https://herdr.dev)]
grants: []
config: |
  plugins:
    - name: herdr
      command: fleetlayer-herdr
security: >-
  Sees every herdr session of its Unix user (names, status, the agent running in each) and types into a session's
  terminal when a message can't go through the agent's own channel. Set typing_fallback false in node.yaml on a
  machine where people work in those tabs.
description: |
  The session manager plugin. It lists herdr's sessions with their status, streams changes, opens and closes
  sessions, delivers messages by typing them in when nothing better is available, and streams terminals for
  `fleetlayer attach`. Codex and other agents running in herdr are in the fleet through it.
