name: herdr-fleet
summary: Every herdr in the fleet as one herdr, for herdr clients such as herdr's phone relay.
kind: plugin
roles: []
ships_with_fleetlayer: true
status: beta
licence: Apache-2.0
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/herdr-fleet
install: bundled
command: fleetlayer-herdr-fleet
platforms: [linux, macos]
min_fleetlayer: 0.3.13
protocol: 1
needs: [herdr 0.9 or later (https://herdr.dev)]
grants: [fleet.query, session.close]
config: |
  plugins:
    - name: herdr-fleet
      command: fleetlayer-herdr-fleet
      grants: [fleet.query, session.close]
security: >-
  Serves a socket only its Unix user can open (0600, in a 0700 folder). Whatever connects to it reads and types into
  other machines' sessions as this node, so the access policy checks every read (read), prompt or key (attach) and
  close (close), and the audit log shows each. It sees the fleet listing this node may see, never more. Leave out
  session.close to keep clients from closing other machines' sessions.
docs: plugins/herdr-fleet
description: |
  A program written for the herdr on its own machine (herdr's phone relay, a dashboard, a script) points at this
  plugin's socket and HERDR_BIN shim instead, unchanged, and sees every machine: this one's herdr as it is, and each
  other machine's sessions as a workspace of its own, to list, read, prompt, type into, watch and close. One phone
  relay for the whole fleet.
