name: fleetlayer-signin
summary: One sign-in, with passkeys or your company's provider, for every web service your fleet runs.
kind: plugin
roles: []
ships_with_fleetlayer: true
status: beta
licence: FSL-1.1-ALv2
maintainer: Fleetlayer
source: https://github.com/fleetlayer/fleetlayer/tree/main/plugins/signin
install: bundled
command: fleetlayer-signin
platforms: [linux, macos]
min_fleetlayer: 0.3.9
protocol: 1
needs: [a control plane from the same release (its sign-in token), an always-on node, an HTTPS proxy in front]
grants: [reading.publish]
config: |
  plugins:
    - name: signin
      command: fleetlayer-signin
      grants: [reading.publish]
      config:
        dir: ~/.local/state/fleetlayer/signin
        issuer: https://signin.example.com
        control_plane: https://control.example.com
        token_file: ~/.config/fleetlayer/signin-token
        listen: 127.0.0.1:7650
        clients:
          - name: hub
            redirect_uris: [https://hub.example.com/_/auth/callback]
            secret_file: ~/.config/fleetlayer/signin-clients/hub
security: >-
  Signs people in to your other services, so whoever controls it can sign in as anyone: run it on an always-on machine
  you administer, behind HTTPS (plain HTTP only on *.localhost). Its control plane token may look up who belongs
  where, use invites, ask access checks and record sign-ins; it also reports passkey uses that unlock changes to
  people, confirms an admin's passkey for a request, adds people an upstream provider vouches for and sets teams from
  a provider's groups. fleetlayer-control signin revoke stops it at once. Every client must use PKCE, and sign_in is
  checked against your access policy before any code is issued. Its folder (dir) holds the token-signing key and
  everyone's passkeys: keep it readable only by its user, and treat any backup of it like a secret.
docs: plugins/signin
description: |
  People sign in once, with a passkey, and use every service that speaks OpenID Connect: the Claude sign-in hub,
  pages, and most self-hosted apps. Who may use which service comes from the same access policy as your agents.
  It covers passkeys, invites, signing in with Google Workspace or any OpenID Connect provider, a provider's groups
  as teams, and signing out everywhere at once. People, invites and teams are managed on the dashboard.
  To run it on another machine later, `fleetlayer move sign-in <machine>` moves it with its keys and data.
